<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".post-content h2, .post-content h3, .post-content h4").forEach((heading) => {
    if (!heading.id) return;
    const anchor = document.createElement("a");
    anchor.href = "#" + heading.id;
    anchor.className = "heading-anchor";
    // A focusable link must stay exposed to assistive technology, so give it
    // an accessible name instead of hiding it.
    anchor.setAttribute("aria-label", {{ i18n.t("Link to this section")|tojson }} + ": " + heading.textContent.trim());
    anchor.textContent = "#";
    heading.appendChild(anchor);
  });
});
</script>
