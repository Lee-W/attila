<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="generator" content="Pelican" />
<meta name="color-scheme" content="light dark" />
{# keep in sync with --paper-light in css-src/02-tokens.css #}
<meta name="theme-color" content="#f7f3e8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#222426" media="(prefers-color-scheme: dark)" />

{% if GOOGLE_SITE_VERIFICATION %}
<meta name="google-site-verification" content="{{ GOOGLE_SITE_VERIFICATION }}">
{% endif %}

{% if SITE_DESCRIPTION and not article and not page %}
<meta name="description" content="{{ SITE_DESCRIPTION|e }}" />
{% endif %}
