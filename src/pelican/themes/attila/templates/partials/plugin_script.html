{% import "partials/plugin_detect.html" as plugins with context %}
{% set needs_osm = plugins.needs_osm()|trim == "True" %}
{% set needs_heatmap = plugins.needs_heatmap()|trim == "True" %}

{% if needs_osm %}
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous"></script>
  <script src="{{ SITEURL }}/static/pelican_osm/js/osm-map.js" defer></script>
{% endif %}

{% if needs_heatmap %}
  <script src="{{ SITEURL }}/static/heatmap/pelican_heatmap.js" defer></script>
{% endif %}
