{% if PAGEFIND_ENABLED|default(True) %}
  <script src="{{ SITEURL }}/pagefind/pagefind-component-ui.js" type="module"></script>
  <script>
  const openModal = async () => {
    await customElements.whenDefined('pagefind-modal');
    const modal = document.querySelector('pagefind-modal');
    try {
      modal?.open();
    } catch {
      modal?.shadowRoot?.querySelector('dialog')?.showModal?.();
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.nav-search').forEach(el => {
      el.addEventListener('click', (e) => { e.preventDefault(); openModal(); });
    });

    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable) return;
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        openModal();
      }
    });
  });
  </script>
{% endif %}
