<!-- MathJax for AsciiDoc sources (stem blocks) -->
{% if article.source_path and article.source_path.lower().endswith(('.adoc','.asciidoc')) %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["\\(", "\\)"]],
      displayMath: [["\\[", "\\]"]],
      tags: "none",
      processEscapes: false
    },
    asciimath: {
      delimiters: [["\\$", "\\$"]]
    },
    options: {
      ignoreHtmlClass: "nostem|nolatexmath|noasciimath"
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha512-tiaNmAzpy3KcgtuiLwT9WSlSsqGqtDB5ylMwxoqG5ysNIyzkBw24k6UFTuXGgyXJLJ8aM/ho1h67NRKedPx++Q==" crossorigin="anonymous"></script>
{% endif %}
